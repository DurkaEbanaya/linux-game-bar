[workspace]
members = ["crates/core", "crates/ui-kit", "crates/gamebar", "crates/fps-helper"]
resolver = "3"

[workspace.package]
version = "0.1.5"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
egui = "0.36.2"
egui_extras = { version = "0.36.2", default-features = false, features = ["svg"] }
egui-wgpu = "0.36.2"
wgpu = "30"
gamebar-core = { path = "crates/core" }
silver-ui-kit = { path = "crates/ui-kit" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
